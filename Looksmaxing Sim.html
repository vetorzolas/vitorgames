<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Looksmaxing Sim</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#1d1230;--card:#2d1f47;--ink:#fff4fb;--mut:#b9a8d6;--pink:#ff5c8a;--mint:#4df0c0;--yel:#ffd84d;--line:#43336a}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#f3ecff;--card:#fff;--ink:#2a1747;--mut:#6f5d91;--line:#ddd0f5}}
:root[data-theme="dark"]{color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;padding:12px 12px 28px}
.top{display:flex;gap:6px}
.top div{flex:1;background:var(--card);border-radius:14px;padding:6px 4px;text-align:center;font-weight:600;font-size:15px}
.top small{display:block;color:var(--mut);font-weight:400;font-size:11px}
.stage{display:flex;gap:10px;align-items:center;margin:10px 0}
.stage svg{width:46%;max-width:210px;border-radius:22px;flex:none;box-shadow:0 8px 24px rgba(255,92,138,.3)}
.right{flex:1;min-width:0}
.score{font-size:46px;font-weight:700;line-height:1;color:var(--mint)}
.rank{display:inline-block;background:var(--pink);color:#fff;border-radius:99px;padding:2px 12px;font-weight:600;font-size:14px;margin:4px 0 8px}
.bar{display:flex;align-items:center;gap:6px;font-size:12px;margin:3px 0}
.bar span:first-child{width:62px;color:var(--mut)}
.bar i{flex:1;height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--mint);border-radius:9px;transition:width .4s}
.toast{background:var(--card);border-left:5px solid var(--yel);border-radius:12px;padding:9px 12px;font-size:14px;min-height:52px}
.toast em{font-style:normal;color:var(--yel);font-weight:600}
.tabs{display:flex;gap:6px;margin:12px 0 8px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;border:0;background:var(--card);color:var(--mut);font:600 14px Fredoka,system-ui,sans-serif;padding:9px 14px;border-radius:99px}
.tabs button.on{background:var(--pink);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:10px;text-align:left;font-family:inherit;min-height:112px;display:flex;flex-direction:column;gap:3px}
.act:active:not(:disabled){transform:scale(.97);border-color:var(--mint)}
.act:disabled{opacity:.38}
.act .ic{font-size:26px;line-height:1}
.act .nm{font-weight:600;font-size:15px}
.act .ds{font-size:12px;color:var(--mut);flex:1}
.act .cs{font-size:12px;color:var(--yel);font-weight:600}
.act.bad{border-style:dashed;border-color:var(--pink)}
.end{width:100%;margin-top:14px;border:0;border-radius:18px;padding:16px;font:700 18px Fredoka,system-ui,sans-serif;background:linear-gradient(90deg,var(--pink),#ff9a5c);color:#fff}
.end:active{transform:scale(.98)}
.over{position:fixed;inset:0;background:rgba(15,8,28,.88);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.over div{background:var(--card);border-radius:24px;padding:24px;max-width:400px;text-align:center}
.over h2{margin:0 0 4px;font-size:26px}
.over p{color:var(--mut);margin:8px 0}
.over .score{font-size:64px}
.toast{animation:pop .3s}.toast.warn{border-left-color:var(--pink);background:#4a1630;color:#fff}
.ct{text-align:center;margin:6px 0}.pv svg{display:block;width:60%;max-width:230px;margin:0 auto;border-radius:22px;box-shadow:0 8px 24px rgba(255,92,138,.3)}.sec{margin:14px 0 0}.sec b{font-size:14px;color:var(--mut)}.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);padding:0}.sw.on{border-color:var(--pink);transform:scale(1.18)}
.pl{border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Fredoka,system-ui,sans-serif;padding:8px 12px;border-radius:99px}.pl.on{background:var(--pink);border-color:var(--pink);color:#fff}
.lad{display:flex;gap:3px;margin:0 0 10px}.lad span{flex:1;text-align:center;font-size:9px;padding:5px 0;border-radius:8px;background:var(--line);color:var(--mut);font-weight:600;overflow:hidden;white-space:nowrap}.lad .ok{background:#2f6f63;color:#fff}.lad .now{background:var(--pink);color:#fff;transform:scale(1.12)}
.warnb{grid-column:1/-1;border:2px dashed var(--pink);border-radius:14px;padding:10px;font-size:13px;color:var(--pink);font-weight:600}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes tw{50%{transform:scale(.4);opacity:.5}}
@keyframes pop{from{transform:scale(.96);opacity:.4}}
.fx{font-size:34px;text-anchor:middle;dominant-baseline:central;transform-box:fill-box;transform-origin:center;opacity:0;animation-duration:1.6s;animation-fill-mode:forwards}
.pt{font-size:16px;text-anchor:middle;opacity:0;transform-box:fill-box;transform-origin:center;animation:rise 1.6s forwards}
.flash{opacity:0;pointer-events:none;animation:fl .8s}
.a-scrub{animation-name:scrub}.a-drop{animation-name:drop}.a-pop{animation-name:xpop}.a-bounce{animation-name:bnc}.a-spin{animation-name:spn}.a-snip{animation-name:snp}
svg.shake{animation:shk .5s}
@keyframes scrub{0%{opacity:0;transform:translateX(-40px)}10%{opacity:1}20%{transform:translateX(40px)}40%{transform:translateX(-40px)}60%{transform:translateX(40px)}80%{opacity:1;transform:translateX(-30px)}100%{opacity:0}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}30%{opacity:1;transform:translateY(0)}70%{opacity:1}100%{opacity:0;transform:translateY(10px) scale(1.4)}}
@keyframes xpop{0%{opacity:0;transform:scale(.2)}30%{opacity:1;transform:scale(1.5)}70%{opacity:1}100%{opacity:0;transform:scale(1.8)}}
@keyframes bnc{0%{opacity:0;transform:translateY(40px)}20%{opacity:1}30%,60%{transform:translateY(-14px)}45%,75%{transform:translateY(10px)}100%{opacity:0}}
@keyframes spn{0%{opacity:0;transform:rotate(0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:rotate(540deg) scale(1.4)}}
@keyframes snp{0%{opacity:0}20%{opacity:1}30%,50%,70%{transform:rotate(25deg)}40%,60%,80%{transform:rotate(-25deg)}100%{opacity:0}}
@keyframes rise{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-70px)}}
@keyframes fl{0%{opacity:.4}100%{opacity:0}}
@keyframes shk{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=id=>document.getElementById(id);
const NAMES={skin:'Pele',jaw:'Mandíbula',hair:'Cabelo',body:'Corpo',aura:'Aura'};
const W={skin:.25,jaw:.2,hair:.2,body:.15,aura:.2};
const DAYS=14;
let S;
function init(){
  const ch=S&&S.ch||{tone:2,style:0,color:1,eyes:0,nose:1};
  S={setup:1,ch,day:1,en:6,mo:100,fol:50,st:{skin:28,jaw:22,hair:28,body:22,aura:22},done:{},mew:0,sun:false,streak:0,pen:0,whiten:0,tab:0,over:false,
  msg:'Você tem 14 dias para o glow up. Gaste a energia com cuidado e depois poste no TikTok.'};
  render();
}
function add(k,v){S.st[k]=Math.max(0,Math.min(100,S.st[k]+v))}
function score(){return Math.round(Object.keys(W).reduce((a,k)=>a+S.st[k]*W[k],0))}
const TIERS=[[30,'Sub-3'],[40,'Sub-5'],[50,'LTN'],[60,'MTN'],[70,'HTN'],[80,'Chadlite'],[90,'Chad'],[101,'True Adam']];
function tier(s){return TIERS.findIndex(t=>s<t[0])}
function rank(s){return TIERS[tier(s)][1]}
function rankOld(s){return s<40?'NPC 🧍':s<55?'Normie 🙂':s<70?'Glow up em andamento ✨':s<85?'Chad de bairro 😎':'Gigachad 👑'}
function R(n){return Math.random()<n}

const A=[
{id:'skin',c:0,i:'🧴',n:'Skincare completo',e:1,m:5,d:'Limpar e hidratar. Constância vale mais que produto.',once:1,run(){const b=S.streak>=3;add('skin',b?10:6);return b?'Streak de pele ativo! 🔥 Bônus extra.':'A pele agradece.'}},
{id:'sun',c:0,i:'☀️',n:'Protetor solar',e:1,m:8,d:'Evita espinhas e manchas hoje.',once:1,run(){S.sun=true;add('skin',3);return 'Escudo solar ligado.'}},
{id:'mew',c:0,i:'👅',n:'Mewing',e:1,m:0,d:'Língua no céu da boca. Rende devagar e cansa.',once:1,run(){const g=Math.max(.5,3-S.mew*.3);S.mew++;add('jaw',g);return S.mew>8?'O mewing já rendeu o que podia. Varie as ações.':'Postura de língua em dia.'}},
{id:'ice',c:0,i:'🧊',n:'Gelo no rosto',e:1,m:0,d:'Desincha e dá brilho.',once:1,run(){add('skin',2);add('aura',1);return 'Rosto desinchado e fresco.'}},
{id:'teeth',c:0,i:'😁',n:'Clareamento dental',e:1,m:25,d:'Sorriso mais brilhante (máx. 2 vezes).',ok(){return S.whiten<2},run(){S.whiten++;add('aura',6);return 'Sorriso de comercial.'}},
{id:'brow',c:0,i:'🪒',n:'Design de sobrancelha',e:1,m:15,d:'Moldura do olhar.',once:1,run(){add('aura',3);add('hair',2);return 'Olhar mais marcante.'}},

{id:'cut',c:1,i:'💈',n:'Corte no barbeiro',e:1,m:40,d:'O maior salto de cabelo do jogo.',once:1,run(){add('hair',16);add('aura',2);return 'Corte novo, cabeça nova.'}},
{id:'pomade',c:1,i:'🪮',n:'Texturizar',e:1,m:10,d:'Pomada ou pó para dar volume.',once:1,run(){add('hair',6);return 'Cabelo com textura.'}},
{id:'shampoo',c:1,i:'🚿',n:'Lavar o cabelo',e:1,m:5,d:'Shampoo anticaspa. Básico que funciona.',once:1,run(){add('hair',4);add('skin',1);return 'Cabelo limpo.'}},

{id:'gym',c:2,i:'🏋️',n:'Treino pesado',e:2,m:0,d:'Ombro largo e postura de quem treina.',once:1,run(){add('body',7);add('aura',2);return 'Treino pago.'}},
{id:'posture',c:2,i:'🧍',n:'Postura (wall angels)',e:1,m:0,d:'Costas retas, pescoço alinhado.',once:1,run(){add('body',3);add('jaw',1);return 'Coluna agradece.'}},
{id:'water',c:2,i:'💧',n:'Beber 3 litros',e:1,m:0,d:'Hidratação ajuda pele e corpo.',once:1,run(){add('skin',2);add('body',1);return 'Hidratado.'}},
{id:'walk',c:2,i:'🚶',n:'Caminhada ao sol',e:1,m:0,d:'Ar livre, humor melhor.',once:1,run(){add('aura',3);add('body',1);return 'Cabeça leve.'}},

{id:'aura',c:3,i:'🪞',n:'Aura farming',e:1,m:0,d:'Treinar presença e olhar no espelho.',once:1,run(){add('aura',5);return 'Presença +1000 (sem exagero).'}},
{id:'smile',c:3,i:'🙂',n:'Treinar sorriso',e:1,m:0,d:'Sorriso natural, sem forçar.',once:1,run(){add('aura',3);add('jaw',1);return 'Sorriso mais solto.'}},
{id:'filter',c:3,i:'🎭',n:'Filtro de beleza',e:0,m:0,d:'Seguidores na hora, mas a autoestima paga.',once:1,run(){S.fol+=Math.round(10+score()/2);add('aura',-3);return 'Subiu seguidor, caiu confiança.'}},
{id:'shop',c:3,i:'🛍️',n:'Produto milagroso',e:0,m:30,d:'Achado do TikTok Shop. Aposta!',run(){if(R(.4)){add('skin',9);return 'Funcionou! Deu sorte.'}if(R(.6)){return 'Não fez nada. Dinheiro no lixo.'}add('skin',-8);return 'Reação alérgica. Cara vermelha.'}},

{id:'bone',c:4,i:'🔨',n:'Bonesmashing',e:1,m:0,d:'Martelar o rosto. Só dá errado.',once:1,run(){add('jaw',-8);add('aura',-5);add('skin',-3);S.bruise=3;return 'Péssima ideia. No mundo real isso machuca de verdade. Não faça.'}},
{id:'diet',c:4,i:'🥬',n:'Dieta de 500 kcal',e:0,m:0,d:'Cortar tudo para “definir”.',once:1,run(){add('body',-6);S.pen+=2;return 'Fraqueza total. Amanhã você acorda sem energia.'}},
{id:'night',c:4,i:'🌙',n:'Virar a noite no TikTok',e:0,m:0,d:'Estudar 40 vídeos de looksmaxing.',once:1,run(){add('skin',-4);S.pen+=2;add('aura',2);return 'Aprendeu 3 termos novos e ganhou olheira.'}},
{id:'gum',c:0,i:'🍬',n:'Chiclete duro',e:1,m:3,d:'Mastigação para treinar a mandíbula.',once:1,run(){add('jaw',2);return 'Mandíbula trabalhando (sem exagero).'}},
{id:'ret',c:0,i:'🌙',n:'Retinol à noite',e:1,m:20,d:'Renova a pele. Sem protetor, irrita.',once:1,run(){if(S.sun){add('skin',8);return 'Pele renovada e protegida.'}add('skin',-1);return 'Sem protetor solar a pele irritou. Use os dois juntos.'}},
{id:'lip',c:0,i:'💋',n:'Hidratar os lábios',e:1,m:3,d:'Detalhe pequeno, efeito visível.',once:1,run(){add('aura',2);add('skin',1);return 'Lábios hidratados.'}},
{id:'beard',c:1,i:'🧔',n:'Alinhar a barba',e:1,m:12,d:'Define o contorno do rosto (uma vez).',ok(){return !S.beard},run(){S.beard=true;add('jaw',4);add('aura',3);return 'Contorno marcado.'}},
{id:'massage',c:1,i:'💆',n:'Massagem no couro',e:1,m:0,d:'Estimula o couro cabeludo.',once:1,run(){add('hair',3);return 'Cabelo mais forte.'}},
{id:'neck',c:2,i:'🦒',n:'Treino de pescoço',e:1,m:0,d:'Pescoço forte, rosto mais marcante.',once:1,run(){add('body',3);add('jaw',2);return 'Pescoço mais firme.'}},
{id:'prot',c:2,i:'🥚',n:'Comer proteína',e:1,m:12,d:'Ovo, frango, iogurte.',once:1,run(){add('body',4);add('skin',1);return 'Músculo agradece.'}},
{id:'sleep',c:2,i:'😴',n:'Sono de beleza',e:1,m:0,d:'Dormir cedo reduz o cansaço de amanhã.',once:1,run(){add('skin',3);add('aura',2);S.pen=Math.max(0,S.pen-2);return 'Descansado e com cara boa.'}},
{id:'fit',c:3,i:'👔',n:'Fit check',e:1,m:35,d:'Roupa que combina muda tudo (uma vez).',ok(){return !S.fit},run(){S.fit=true;add('aura',7);add('body',1);return 'Fit aprovado.'}},
{id:'perf',c:3,i:'🌸',n:'Perfume',e:1,m:20,d:'Cheiro bom é presença.',once:1,run(){add('aura',3);return 'Deixou rastro de aura.'}},
{id:'grwm',c:3,i:'🎬',n:'Vídeo GRWM',e:1,m:0,d:'Rotina real atrai seguidor de verdade.',once:1,run(){const g=Math.round(15+score()/1.5);S.fol+=g;add('aura',1);return 'O vídeo de rotina deu certo: +'+g+' seguidores.'}},
{id:'breath',c:3,i:'🧘',n:'Respirar fundo',e:1,m:0,d:'Calma gera confiança.',once:1,run(){add('aura',2);S.pen=Math.max(0,S.pen-1);return 'Mente tranquila.'}},
{id:'lemon',c:4,i:'🍋',n:'Limão no rosto',e:0,m:0,d:'“Clareia a pele”, diz o vídeo.',once:1,run(){add('skin',-8);return 'Queimadura e mancha. Limão irrita e piora a pele.'}},
{id:'scrub',c:4,i:'🧽',n:'Esfoliar 10 vezes',e:0,m:0,d:'Quanto mais, melhor? Não.',once:1,run(){add('skin',-9);add('aura',-2);return 'Barreira da pele destruída. Menos é mais.'}},
{id:'bleach',c:4,i:'🧪',n:'Descolorir em casa',e:1,m:15,d:'Loiro de tutorial feito sozinho.',ok(){return !S.bleach},run(){S.bleach=true;add('hair',-12);return 'Cabelo amarelo e quebradiço. Descoloração pede profissional.'}},
{id:'elastic',c:4,i:'🪢',n:'Faixa para o queixo',e:0,m:10,d:'Aparelho caseiro de “jawline”.',once:1,run(){add('jaw',-4);add('skin',-2);return 'Só dor e marca na pele. Não existe atalho assim.'}},
{id:'cream',c:4,i:'🧴',n:'Creme que cresce queixo',e:0,m:40,d:'Promessa de TikTok Shop.',once:1,run(){add('aura',-2);return 'Era hidratante comum. Você perdeu R$40. Golpe clássico.'}},
{id:'followers',c:4,i:'🤖',n:'Comprar seguidores',e:0,m:20,d:'Número alto, zero verdade.',once:1,run(){S.fol+=200;add('aura',-4);return 'Subiu o número, caiu a confiança. Seguidor falso não vira amigo.'}},
{id:'surgery',c:4,i:'✈️',n:'Cirurgia barata no exterior',e:1,m:90,d:'Pacote promocional do TikTok.',once:1,run(){if(R(.7)){add('jaw',-6);add('skin',-6);S.pen+=3;S.bruise=3;return 'Deu muito errado: inchaço e dor. Cirurgia é com médico de verdade.'}add('jaw',3);S.pen+=1;return 'Teve sorte, mas foi aposta arriscada. Não vale.'}}
];
const TABS=['Rosto','Cabelo','Corpo','Mente','Cilada ⚠️'];

function act(id){
  if(S.over)return;
  const a=A.find(x=>x.id==id);
  if(S.en<a.e||S.mo<a.m||(a.once&&S.done[id])||(a.ok&&!a.ok()))return;
  const before={...S.st},t0=tier(score());
  S.en-=a.e;S.mo-=a.m;S.done[id]=1;
  const t=a.run();
  const dl=Object.keys(before).filter(k=>Math.round(S.st[k])!=Math.round(before[k])).map(k=>{const d=Math.round(S.st[k])-Math.round(before[k]);return NAMES[k]+' '+(d>0?'+':'')+d}).join(' · ');
  S.warn=a.c==4;S.fx=id;S.fxNew=true;S.msg=(S.warn?t.split('. ')[0]:t)+(dl?' <em>'+dl+'</em>':'');
  const t1=tier(score());if(t1!=t0)S.msg+=t1>t0?' <em>⬆️ Subiu para '+TIERS[t1][1]+'!</em>':' <em>⬇️ Caiu para '+TIERS[t1][1]+'</em>';
  render();
}
const FX={skin:['🧼','scrub','🫧',110],sun:['🧴','drop','☀️',100],mew:['👅','xpop','⬆️',165],ice:['🧊','drop','❄️',110],teeth:['🪥','scrub','✨',164],brow:['🪒','scrub','✨',100],gum:['🍬','bnc','💥',162],ret:['🌙','spn','✨',100],lip:['💄','scrub','💋',164],
cut:['✂️','snp','💨',66],pomade:['🪮','scrub','✨',66],shampoo:['🚿','drop','🫧',66],beard:['🪒','scrub','✨',165],massage:['💆','xpop','✨',66],
gym:['🏋️','bnc','💦',210],posture:['⬆️','bnc','✨',150],water:['💧','drop','💧',110],walk:['🚶','scrub','☀️',215],neck:['🦒','bnc','💪',185],prot:['🥚','drop','💪',215],sleep:['😴','xpop','💤',90],
aura:['🪞','xpop','✨',100],smile:['😁','xpop','✨',162],filter:['🎭','spn','✨',100],shop:['🛍️','bnc','❓',150],fit:['👔','drop','✨',215],perf:['🌸','xpop','🌸',150],grwm:['🎬','xpop','❤️',100],breath:['🧘','xpop','🌿',100],
bone:['🔨','snp','💥',150],diet:['🥬','drop','💨',210],night:['📱','xpop','💤',100],lemon:['🍋','drop','💢',110],scrub:['🧽','scrub','💢',110],bleach:['🧪','drop','💨',66],elastic:['🪢','xpop','💢',165],cream:['🧴','drop','💸',150],followers:['🤖','xpop','💸',100],surgery:['✈️','spn','💥',100],post:['📱','xpop','❤️',100]};
function fxSvg(){
  const f=S.fxNew&&FX[S.fx];if(!f)return '';
  const bad=S.warn,xs=[48,152,72,128,100,60];
  return `<rect class="flash" width="200" height="240" fill="${bad?'#ff2d55':'#4df0c0'}"/>`+xs.map((x,i)=>`<text class="pt" x="${x}" y="${150+(i%2)*30}" style="animation-delay:${i*.12}s">${f[2]}</text>`).join('')+`<text class="fx a-${f[1]}" x="100" y="${f[3]}">${f[0]}</text>`+(bad?`<text class="fx a-xpop" style="animation-delay:.5s;font-size:54px" x="100" y="110">❌</text>`:'');
}

    const off=S.en<a.e||S.mo<a.m||(a.once&&S.done[a.id])||(a.ok&&!a.ok());
    const cost=[a.e?'⚡'+a.e:'⚡0',a.m?'R$'+a.m:''].join(' ');
    return `<button class="act ${a.c==4?'bad':''}" ${off?'disabled':''} onclick="act('${a.id}')"><span class="ic">${a.i}</span><span class="nm">${a.n}</span><span class="ds">${a.d}</span><span class="cs">${a.once&&S.done[a.id]?'Feito hoje':cost}</span></button>`}).join('');
  $('app').innerHTML=`
  <div class="top"><div>${S.day}/${DAYS}<small>Dia</small></div><div>⚡${S.en}<small>Energia</small></div><div>R$${S.mo}<small>Grana</small></div><div>${S.fol.toLocaleString('pt-BR')}<small>Seguidores</small></div></div>
  <div class="stage">${face()}<div class="right"><div class="score">${s}</div><div class="rank">${rank(s)}</div>${bars}</div></div>
  <div class="lad">${TIERS.map((t,i)=>`<span class="${i<tier(s)?'ok':i==tier(s)?'now':''}">${t[1]}</span>`).join('')}</div>
  <div class="toast ${S.warn?'warn':''}">${S.warn?'❌ ':''}${S.msg}</div>
  <div class="tabs">${TABS.map((t,i)=>`<button class="${i==S.tab?'on':''}" onclick="tab(${i})">${t}</button>`).join('')}</div>
  <div class="grid">${list}</div>
  <button class="end" onclick="endDay()">Dormir e postar no TikTok 📱</button>`;
}
init();
</script>
</body>
</html>
